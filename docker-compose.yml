# Solo PostgreSQL 16. Los nodos Java corren fuera de Docker con los scripts run-nodoX.
# Credenciales y puerto salen de .env (DB_NOMBRE, DB_USUARIO, DB_PASSWORD, DB_PORT).
services:
  postgres:
    image: postgres:16
    container_name: apex-postgres
    environment:
      POSTGRES_DB: ${DB_NOMBRE:-apex}
      POSTGRES_USER: ${DB_USUARIO:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - apex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USUARIO:-postgres} -d ${DB_NOMBRE:-apex}"]
      interval: 3s
      retries: 20
volumes:
  apex_pgdata:
