services:
  nodo2:
    environment:
      DB_MODO: contenedor
      DB_HOST: nodo4
    networks: [red_publica, red_pagos, red_datos]
  nodo4:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NOMBRE:-apexstore}
      POSTGRES_USER: ${DB_USUARIO:-apexstore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes: ["apexstore_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [red_datos]
networks:
  red_datos:
    internal: true
volumes:
  apexstore_pgdata: {}
